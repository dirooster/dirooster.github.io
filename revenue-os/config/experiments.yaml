- id: EXP-A-001
  track: ai_production_rescue
  hypothesis: >
    CTOs and technical founders at B2B software companies with visible AI
    features will respond to a fixed-scope AI Production Audit offer.
  audience:
    company_type: b2b_software
    trigger: public_ai_feature_or_ai_product_positioning
  offer:
    name: AI Production Audit
    price_test_eur:
      - 1500
      - 2500
      - 3500
  channel:
    - email
    - linkedin
  sample_size: 30
  success:
    replies: 5
    positive_replies: 3
    calls: 2
  status: active

- id: EXP-B-001
  track: logistics_automation
  hypothesis: >
    Freight forwarders and logistics operators with document-heavy workflows
    will discuss a narrow automation pilot when the offer is framed around
    reducing manual retyping from emails, PDFs, and spreadsheets.
  audience:
    company_type: logistics_operator
    trigger: freight_or_document_workflow
  offer:
    name: Logistics Workflow Analysis
    price_test_eur:
      - 0
      - 500
      - 1000
  channel:
    - email
    - linkedin
  sample_size: 20
  success:
    replies: 4
    positive_replies: 2
    calls: 2
  status: active

